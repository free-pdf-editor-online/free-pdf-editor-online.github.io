<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#bg)" filter="url(#shadow)" />
  
  <!-- Stylized Document Lines -->
  <path d="M 32 32 L 62 32" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path d="M 32 44 L 52 44" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <circle cx="82" cy="32" r="4" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="82" cy="44" r="4" fill="#FFFFFF" opacity="0.8"/>

  <!-- Bold PDF Text -->
  <text x="60" y="85" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">PDF</text>
  
  <!-- Edit Pen Sparkle -->
  <path d="M 85 70 L 90 65 L 95 70 L 90 75 Z" fill="#FCA5A5" />
</svg>
